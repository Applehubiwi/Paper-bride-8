<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>paper bride 8 và 9 walkthrough</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Font chữ phong cách cổ trang/kinh dị -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Noto+Serif+JP:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Serif JP', serif;
            background-color: #0b0707;
            color: #d1d5db;
        }
        .horror-title {
            font-family: 'Cinzel', serif;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-red-900 selection:text-white">

    <!-- Header -->
    <header class="border-b border-red-950/60 bg-black/80 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="text-center sm:text-left">
                <h1 class="horror-title text-2xl sm:text-3xl font-black text-red-600 tracking-wider uppercase drop-shadow-[0_2px_10px_rgba(220,38,38,0.5)]">
                    paper bride 8 và 9 walkthrough
                </h1>
                <p class="text-xs tracking-widest text-red-400/70 mt-1 uppercase font-semibold">made by dora</p>
            </div>
            
            <!-- Khu vực trạng thái Admin / Đăng nhập -->
            <div id="authContainer" class="flex items-center gap-3">
                <button onclick="openLoginModal()" class="px-4 py-2 text-xs uppercase tracking-wider font-bold rounded bg-red-950/40 border border-red-800 text-red-400 hover:bg-red-900 hover:text-white transition shadow-[0_0_10px_rgba(139,0,0,0.3)] cursor-pointer">
                    🔐 Admin Login
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-3xl w-full mx-auto px-4 py-8 flex-grow">
        
        <!-- Khung Upload dành riêng cho Admin (Mặc định ẩn) -->
        <div id="adminUploadSection" class="hidden mb-10 p-5 sm:p-6 bg-red-950/20 border border-red-900/60 rounded-xl shadow-[0_0_20px_rgba(139,0,0,0.15)]">
            <div class="flex justify-between items-center mb-4 border-b border-red-900/40 pb-3">
                <span class="text-sm font-bold text-red-500 uppercase tracking-wider flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-red-600 animate-ping"></span> Đăng Tải Ảnh Walkthrough (Admin)
                </span>
                <button onclick="logoutAdmin()" class="text-xs text-red-400 hover:text-red-300 underline cursor-pointer">Đăng xuất</button>
            </div>
            <form id="uploadForm" onsubmit="handleUpload(event)" class="space-y-4">
                
                <!-- Chọn danh mục -->
                <div>
                    <label class="block text-xs uppercase tracking-wider text-red-400 mb-2 font-semibold">Chọn danh mục (Phần game):</label>
                    <select id="imageCategory" required
                        class="w-full bg-black/60 border border-red-900/60 rounded px-3 py-2 text-sm text-zinc-200 focus:outline-none focus:border-red-600">
                        <option value="Paper Bride 8">Paper Bride 8</option>
                        <option value="Paper Bride 9">Paper Bride 9</option>
                        <option value="Mẹo chung / Bí ẩn khác">Mẹo chung / Bí ẩn khác</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs uppercase tracking-wider text-red-400 mb-2 font-semibold">Chọn file ảnh từ thiết bị:</label>
                    <input type="file" id="imageFileInput" accept="image/*" required onchange="previewSelectedImage(event)"
                        class="w-full text-xs text-zinc-400 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-xs file:font-bold file:bg-red-900 file:text-red-100 hover:file:bg-red-800 file:cursor-pointer cursor-pointer border border-red-900/50 rounded bg-black/40 p-2">
                </div>

                <!-- Khung Xem Trước Ảnh (Preview) -->
                <div id="previewContainer" class="hidden">
                    <label class="block text-xs uppercase tracking-wider text-red-400 mb-2 font-semibold">Xem trước ảnh trước khi up:</label>
                    <div class="relative w-full h-48 bg-black/60 border border-red-900/50 rounded-lg flex items-center justify-center overflow-hidden">
                        <img id="imagePreview" src="" alt="Preview" class="max-h-full max-w-full object-contain">
                    </div>
                </div>

                <div>
                    <label class="block text-xs uppercase tracking-wider text-red-400 mb-2 font-semibold">Nội dung hướng dẫn:</label>
                    <textarea id="imageCaption" rows="3" placeholder="Nhập hướng dẫn hoặc lưu ý qua màn..." required
                        class="w-full bg-black/60 border border-red-900/60 rounded px-3 py-2 text-sm text-zinc-200 focus:outline-none focus:border-red-600 placeholder:text-zinc-600 resize-none"></textarea>
                </div>
                <button type="submit" class="w-full py-2.5 bg-red-800 hover:bg-red-700 text-white text-xs font-bold uppercase tracking-widest rounded transition shadow-[0_0_15px_rgba(220,38,38,0.4)] cursor-pointer">
                    Đăng Ảnh (Cũ nhất ở trên)
                </button>
            </form>
        </div>

        <!-- Danh sách Walkthrough Images -->
        <div class="space-y-8">
            <div class="flex justify-between items-center border-b border-red-950 pb-2">
                <h2 class="text-sm font-bold uppercase tracking-widest text-red-600">Bản Hướng Dẫn (Cũ nhất ở trên)</h2>
                <span id="totalImages" class="text-xs text-zinc-500">0 ảnh</span>
            </div>
            
            <div id="imageFeed" class="space-y-6">
                <!-- Danh sách ảnh render động bằng JavaScript -->
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="text-center py-6 border-t border-red-950/40 text-xs text-zinc-600">
        <p>Paper Bride 8 & 9 Walkthrough • Made by dora</p>
    </footer>

    <!-- Modal Đăng Nhập Admin -->
    <div id="loginModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
        <div class="bg-zinc-950 border border-red-900/70 rounded-xl p-6 max-w-sm w-full shadow-[0_0_30px_rgba(220,38,38,0.2)]">
            <h3 class="horror-title text-lg font-bold text-red-500 mb-4 text-center uppercase">Xác Thực Quản Trị Viên</h3>
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs uppercase text-zinc-400 mb-1">Tài khoản (Username):</label>
                    <input type="text" id="usernameInput" required placeholder="Admindepzai"
                        class="w-full bg-black border border-red-900/50 rounded px-3 py-2 text-sm text-zinc-200 focus:outline-none focus:border-red-600">
                </div>
                <div>
                    <label class="block text-xs uppercase text-zinc-400 mb-1">Mật khẩu (Password):</label>
                    <input type="password" id="passwordInput" required placeholder="••••••••••••"
                        class="w-full bg-black border border-red-900/50 rounded px-3 py-2 text-sm text-zinc-200 focus:outline-none focus:border-red-600">
                </div>
                <div class="flex gap-2 pt-2">
                    <button type="button" onclick="closeLoginModal()" class="w-1/2 py-2 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 text-xs font-bold uppercase rounded cursor-pointer">Hủy</button>
                    <button type="submit" class="w-1/2 py-2 bg-red-800 hover:bg-red-700 text-white text-xs font-bold uppercase rounded cursor-pointer">Đăng Nhập</button>
                </div>
            </form>
        </div>
    </div>

    <!-- JavaScript Xử lý logic -->
    <script>
        // Dữ liệu mẫu ban đầu có sẵn danh mục
        const defaultImages = [
            {
                id: 1,
                category: "Paper Bride 8",
                url: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=800&auto=format&fit=crop",
                caption: "Hướng dẫn giải mật mã quạt giấy và bức tranh tường đầu chương 2.",
                time: "2026-06-06 12:00"
            }
        ];

        let images = JSON.parse(localStorage.getItem('paper_bride_images_v4')) || defaultImages;
        let isAdmin = localStorage.getItem('paper_bride_is_admin') === 'true';

        function init() {
            renderImages();
            updateAdminUI();
        }

        function updateAdminUI() {
            const uploadSection = document.getElementById('adminUploadSection');
            const authContainer = document.getElementById('authContainer');

            if (isAdmin) {
                uploadSection.classList.remove('hidden');
                authContainer.innerHTML = `
                    <div class="flex items-center gap-2">
                        <span class="text-xs text-red-500 font-bold uppercase bg-red-950/60 px-2 py-1 rounded border border-red-800">👑 Admin Active</span>
                        <button onclick="logoutAdmin()" class="px-3 py-1.5 text-xs uppercase font-bold rounded bg-zinc-800 text-zinc-300 hover:bg-zinc-700 cursor-pointer">Thoát</button>
                    </div>
                `;
            } else {
                uploadSection.classList.add('hidden');
                authContainer.innerHTML = `
                    <button onclick="openLoginModal()" class="px-4 py-2 text-xs uppercase tracking-wider font-bold rounded bg-red-950/40 border border-red-800 text-red-400 hover:bg-red-900 hover:text-white transition shadow-[0_0_10px_rgba(139,0,0,0.3)] cursor-pointer">
                        🔐 Admin Login
                    </button>
                `;
            }
        }

        function openLoginModal() {
            document.getElementById('loginModal').classList.remove('hidden');
        }

        function closeLoginModal() {
            document.getElementById('loginModal').classList.add('hidden');
        }

        function handleLogin(e) {
            e.preventDefault();
            const user = document.getElementById('usernameInput').value;
            const pass = document.getElementById('passwordInput').value;

            if (user === 'Admindepzai' && pass === '36676767') {
                isAdmin = true;
                localStorage.setItem('paper_bride_is_admin', 'true');
                closeLoginModal();
                updateAdminUI();
                alert('Đăng nhập quản trị thành công!');
            } else {
                alert('Sai tài khoản hoặc mật khẩu admin!');
            }
        }

        function logoutAdmin() {
            isAdmin = false;
            localStorage.setItem('paper_bride_is_admin', 'false');
            updateAdminUI();
        }

        // Xem trước ảnh khi chọn file
        function previewSelectedImage(event) {
            const file = event.target.files[0];
            const previewContainer = document.getElementById('previewContainer');
            const imagePreview = document.getElementById('imagePreview');

            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    imagePreview.src = e.target.result;
                    previewContainer.classList.remove('hidden');
                }
                reader.readAsDataURL(file);
            } else {
                previewContainer.classList.add('hidden');
            }
        }

        // Xử lý upload: lưu danh mục kèm theo
        function handleUpload(e) {
            e.preventDefault();
            if (!isAdmin) return;

            const categoryInput = document.getElementById('imageCategory');
            const fileInput = document.getElementById('imageFileInput');
            const captionInput = document.getElementById('imageCaption');
            const file = fileInput.files[0];

            if (file) {
                const reader = new FileReader();
                reader.onload = function(uploadEvent) {
                    const newImg = {
                        id: Date.now(),
                        category: categoryInput.value,
                        url: uploadEvent.target.result,
                        caption: captionInput.value,
                        time: new Date().toLocaleString('vi-VN')
                    };

                    // Đẩy ảnh mới xuống dưới, ảnh cũ giữ ở trên
                    images.push(newImg);
                    localStorage.setItem('paper_bride_images_v4', JSON.stringify(images));

                    // Reset form & ẩn preview
                    fileInput.value = '';
                    captionInput.value = '';
                    document.getElementById('previewContainer').classList.add('hidden');

                    renderImages();
                    alert('Đã đăng ảnh cùng danh mục thành công!');
                };
                reader.readAsDataURL(file);
            }
        }

        function deleteImage(id) {
            if (!isAdmin) return;
            if (confirm('Bạn có chắc muốn xóa ảnh hướng dẫn này không?')) {
                images = images.filter(img => img.id !== id);
                localStorage.setItem('paper_bride_images_v4', JSON.stringify(images));
                renderImages();
            }
        }

        function renderImages() {
            const feed = document.getElementById('imageFeed');
            const totalImages = document.getElementById('totalImages');
            
            totalImages.innerText = `${images.length} ảnh`;

            if (images.length === 0) {
                feed.innerHTML = `<div class="text-center py-12 text-zinc-600 text-xs uppercase tracking-widest">Chưa có ảnh walkthrough nào được đăng.</div>`;
                return;
            }

            // Hiển thị danh mục và giữ ảnh cũ ở trên cùng
            feed.innerHTML = images.map((img, index) => `
                <div class="bg-zinc-950/70 border border-red-950/80 rounded-xl overflow-hidden shadow-[0_4px_20px_rgba(0,0,0,0.8)]">
                    <div class="p-3 bg-black/40 border-b border-red-950 flex justify-between items-center text-xs">
                        <div class="flex items-center gap-2">
                            <span class="font-bold text-red-500 uppercase">Walkthrough #${index + 1}</span>
                            <span class="bg-red-950/80 border border-red-900/60 text-red-300 px-2 py-0.5 rounded font-semibold">${img.category || 'Paper Bride 8'}</span>
                        </div>
                        <span class="text-zinc-500">${img.time}</span>
                    </div>
                    <div class="p-4 bg-black/20 flex justify-center items-center">
                        <a href="${img.url}" target="_blank" class="block max-h-[500px] overflow-hidden rounded group">
                            <img src="${img.url}" alt="Walkthrough Image" class="max-h-[450px] w-auto object-contain transition duration-300 group-hover:scale-[1.01]">
                        </a>
                    </div>
                    <div class="p-4 border-t border-red-950/50 flex justify-between items-start gap-4">
                        <p class="text-sm text-zinc-300 leading-relaxed font-serif whitespace-pre-wrap">${img.caption}</p>
                        ${isAdmin ? `<button onclick="deleteImage(${img.id})" class="text-xs text-red-500 hover:text-red-400 shrink-0 uppercase font-bold cursor-pointer">Xóa</button>` : ''}
                    </div>
                </div>
            `).join('');
        }

        init();
    </script>
</body>
</html>
